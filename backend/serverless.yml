service: notification-system
frameworkVersion: '3'

plugins:
  - serverless-esbuild
  - serverless-iam-roles-per-function

custom:
  esbuild:
    bundle: true
    minify: false
    target: node22
  # Дараалалын redrive policy болон worker-ийн дахин оролдлого хоёрт зориулсан нэг тоо.
  maxAttempts: 3
  # Browser-оос API руу хандахыг зөвшөөрөх origin. Апп API-ийн өөрийн origin-оос (web функц) үйлчилдэг тул
  # CORS хэрэггүй; CORS_ORIGIN нь өөр газар (Vercel) байрлуулсан frontend-ийг нэмнэ.
  # Анхдагч: энэ stack-ийн өөрийн URL (HttpApiUrl output-оос уншина), байхгүй бол (анхны deploy) дурын origin.
  corsOrigin: ${env:CORS_ORIGIN, cf:notification-system-${self:provider.stage}.HttpApiUrl, '*'}
  serverless-iam-roles-per-function:
    # Функц бүр зөвхөн өөрийн iamRoleStatements-д жагсаасан эрхтэй байна.
    defaultInherit: false

provider:
  name: aws
  runtime: nodejs22.x
  memorySize: 256
  region: ap-southeast-2
  stage: ${opt:stage, 'dev'}
  httpApi:
    cors:
      allowedOrigins:
        - ${self:custom.corsOrigin}
        - http://localhost:5173
      allowedHeaders:
        - Content-Type
        - Authorization
        - Idempotency-Key
      allowedMethods:
        - GET
        - POST
        - OPTIONS
      maxAge: 3600
    authorizers:
      cognitoJwt:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl:
          Fn::Join:
            - ''
            - - 'https://cognito-idp.${self:provider.region}.amazonaws.com/'
              - Ref: UserPool
        audience:
          - Ref: UserPoolClient
  websocketsApiName: ${self:service}-${self:provider.stage}-ws
  websocketsApiRouteSelectionExpression: $request.body.action
  environment:
    NOTIFICATIONS_TABLE: ${self:service}-${self:provider.stage}-notifications
    CONNECTIONS_TABLE: ${self:service}-${self:provider.stage}-connections
    MAX_ATTEMPTS: ${self:custom.maxAttempts}
    QUEUE_URL:
      Ref: NotificationQueue
    WS_ENDPOINT:
      Fn::Join:
        - ''
        - - 'https://'
          - Ref: WebsocketsApi
          - '.execute-api.${self:provider.region}.amazonaws.com/${self:provider.stage}'

# Build хийсэн frontend (backend/web, scripts/deploy-frontend.sh үүсгэнэ) функцүүдтэй хамт багцлагдана.
package:
  patterns:
    - web/**

functions:
  # GET / болон тохирохгүй бусад GET-д React апп-ыг үйлчилнэ. /notifications гэсэн тодорхой замууд
  # илүү нарийвчлалтай тул тэд хэвээр түрүүлнэ.
  web:
    handler: src/handlers/web.handler
    iamRoleStatements: []
    events:
      - httpApi:
          path: /
          method: GET
      - httpApi:
          path: /{proxy+}
          method: GET

  createNotification:
    handler: src/handlers/createNotification.handler
    events:
      - httpApi:
          path: /notifications
          method: post
          authorizer:
            name: cognitoJwt
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:PutItem
          - dynamodb:GetItem
        Resource:
          - Fn::GetAtt: [NotificationsTable, Arn]
      - Effect: Allow
        Action:
          - sqs:SendMessage
        Resource:
          - Fn::GetAtt: [NotificationQueue, Arn]

  listNotifications:
    handler: src/handlers/listNotifications.handler
    events:
      - httpApi:
          path: /notifications
          method: get
          authorizer:
            name: cognitoJwt
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:Query
        Resource:
          - Fn::Join:
              - '/'
              - - Fn::GetAtt: [NotificationsTable, Arn]
                - index
                - byUser

  worker:
    handler: src/handlers/worker.handler
    timeout: 60
    events:
      - sqs:
          arn:
            Fn::GetAtt: [NotificationQueue, Arn]
          batchSize: 5
          # Зөвхөн алдаатай record-ууд дараалалд буцна, бүх batch биш.
          functionResponseType: ReportBatchItemFailures
          # Нэгэн зэрэг 5-аас илүү worker ажиллахгүй: гэнэтийн ачаалалаас DynamoDB, WebSocket API-г хамгаална.
          maximumConcurrency: 5
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:UpdateItem
        Resource:
          - Fn::GetAtt: [NotificationsTable, Arn]
      - Effect: Allow
        Action:
          - dynamodb:Query
        Resource:
          - Fn::Join:
              - '/'
              - - Fn::GetAtt: [ConnectionsTable, Arn]
                - index
                - byUser
      - Effect: Allow
        Action:
          - dynamodb:DeleteItem
        Resource:
          - Fn::GetAtt: [ConnectionsTable, Arn]
      - Effect: Allow
        Action:
          - sqs:ReceiveMessage
          - sqs:DeleteMessage
          - sqs:GetQueueAttributes
          - sqs:ChangeMessageVisibility
        Resource:
          - Fn::GetAtt: [NotificationQueue, Arn]
      - Effect: Allow
        Action:
          - execute-api:ManageConnections
        Resource:
          - Fn::Join:
              - ''
              - - 'arn:aws:execute-api:${self:provider.region}:'
                - Ref: AWS::AccountId
                - ':'
                - Ref: WebsocketsApi
                - '/${self:provider.stage}/POST/@connections/*'

  # Message нь dead-letter queue-д орсон notification-уудыг дуусгана.
  dlqProcessor:
    handler: src/handlers/dlqProcessor.handler
    timeout: 30
    events:
      - sqs:
          arn:
            Fn::GetAtt: [NotificationDLQ, Arn]
          batchSize: 5
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:UpdateItem
        Resource:
          - Fn::GetAtt: [NotificationsTable, Arn]
      - Effect: Allow
        Action:
          - dynamodb:Query
        Resource:
          - Fn::Join:
              - '/'
              - - Fn::GetAtt: [ConnectionsTable, Arn]
                - index
                - byUser
      - Effect: Allow
        Action:
          - dynamodb:DeleteItem
        Resource:
          - Fn::GetAtt: [ConnectionsTable, Arn]
      - Effect: Allow
        Action:
          - sqs:ReceiveMessage
          - sqs:DeleteMessage
          - sqs:GetQueueAttributes
        Resource:
          - Fn::GetAtt: [NotificationDLQ, Arn]
      - Effect: Allow
        Action:
          - execute-api:ManageConnections
        Resource:
          - Fn::Join:
              - ''
              - - 'arn:aws:execute-api:${self:provider.region}:'
                - Ref: AWS::AccountId
                - ':'
                - Ref: WebsocketsApi
                - '/${self:provider.stage}/POST/@connections/*'

  # phase2:begin
  # "DynamoDB-д хадгалагдсан" ба "SQS-д илгээгдсэн" хоёрын завсрыг засна.
  requeueStale:
    handler: src/handlers/requeueStale.handler
    timeout: 60
    events:
      - schedule: rate(5 minutes)
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:Query
        Resource:
          - Fn::Join:
              - '/'
              - - Fn::GetAtt: [NotificationsTable, Arn]
                - index
                - byStatus
      - Effect: Allow
        Action:
          - sqs:SendMessage
        Resource:
          - Fn::GetAtt: [NotificationQueue, Arn]
  # phase2:end

  wsAuthorizer:
    handler: src/handlers/wsAuthorizer.handler
    # Хоосон жагсаалт = зөвхөн лог бичих эрхтэй өөрийн role. Үүнгүй бол функц нийтлэг role руу очдог бөгөөд
    # тэр role бусад функцүүдийн WebSocket, SQS эрхийг агуулдаг.
    iamRoleStatements: []
    environment:
      USER_POOL_ID:
        Ref: UserPool
      USER_POOL_CLIENT_ID:
        Ref: UserPoolClient

  wsConnect:
    handler: src/handlers/wsConnect.handler
    events:
      - websocket:
          route: $connect
          authorizer:
            name: wsAuthorizer
            identitySource:
              - route.request.querystring.token
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:PutItem
        Resource:
          - Fn::GetAtt: [ConnectionsTable, Arn]

  wsDisconnect:
    handler: src/handlers/wsDisconnect.handler
    events:
      - websocket:
          route: $disconnect
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:DeleteItem
        Resource:
          - Fn::GetAtt: [ConnectionsTable, Arn]

  # Зөвхөн demo: шинэ хэрэглэгчийг тэр дор нь баталгаажуулж, бүртгэлд имэйл дамжих шаардлагагүй болгоно.
  preSignUp:
    handler: src/handlers/preSignUp.handler
    iamRoleStatements: []

resources:
  Conditions:
    HasAlarmEmail:
      Fn::Not:
        - Fn::Equals:
            - ${env:ALARM_EMAIL, ''}
            - ''

  # API stage бүрийн rate limit (секундэд хүсэлт, ба богино burst).
  extensions:
    HttpApiStage:
      Properties:
        DefaultRouteSettings:
          ThrottlingRateLimit: 25
          ThrottlingBurstLimit: 50
    WebsocketsDeploymentStage:
      Properties:
        DefaultRouteSettings:
          ThrottlingRateLimit: 25
          ThrottlingBurstLimit: 50

  Resources:
    NotificationsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.NOTIFICATIONS_TABLE}
        BillingMode: PAY_PER_REQUEST
        # Хуучин хүсэлт 90 хоногийн дараа устна (expiresAt, мөр үүсэх үед тавигдана).
        TimeToLiveSpecification:
          AttributeName: expiresAt
          Enabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
          # phase2:begin
          - AttributeName: status
            AttributeType: S
          - AttributeName: updatedAt
            AttributeType: S
          # phase2:end
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          # "Миний notification-ууд, шинэ нь эхэнд": хуудас бүр нэг Query.
          - IndexName: byUser
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          # phase2:begin
          # Sweeper хүснэгтийг scan хийлгүйгээр удсан PENDING мөрүүдийг олно.
          - IndexName: byStatus
            KeySchema:
              - AttributeName: status
                KeyType: HASH
              - AttributeName: updatedAt
                KeyType: RANGE
            Projection:
              ProjectionType: KEYS_ONLY
          # phase2:end

    ConnectionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.CONNECTIONS_TABLE}
        BillingMode: PAY_PER_REQUEST
        TimeToLiveSpecification:
          AttributeName: expiresAt
          Enabled: true
        AttributeDefinitions:
          - AttributeName: connectionId
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: connectionId
            KeyType: HASH
        GlobalSecondaryIndexes:
          # "Энэ хэрэглэгчийн нээлттэй бүх tab": status өөрчлөлт зөвхөн эзэмшигчид хүрэх арга.
          - IndexName: byUser
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
              - AttributeName: connectionId
                KeyType: RANGE
            Projection:
              ProjectionType: KEYS_ONLY

    NotificationDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${self:provider.stage}-dlq
        MessageRetentionPeriod: 1209600

    NotificationQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${self:provider.stage}-queue
        # Worker-ийн timeout-ийн (60 с) зургаа дахин, AWS-ийн зөвлөснөөр.
        VisibilityTimeout: 360
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt: [NotificationDLQ, Arn]
          maxReceiveCount: ${self:custom.maxAttempts}

    # ---- Хяналт ----
    # Alarm ажиллахад имэйл авахын тулд deploy хийхдээ ALARM_EMAIL-ийг тохируулна.
    AlarmTopic:
      Type: AWS::SNS::Topic

    AlarmEmailSubscription:
      Type: AWS::SNS::Subscription
      Condition: HasAlarmEmail
      Properties:
        TopicArn:
          Ref: AlarmTopic
        Protocol: email
        Endpoint: ${env:ALARM_EMAIL, ''}

    # dlqProcessor нь зөвхөн message dead-letter болсон үед ажилладаг тул ямар ч ажиллалт нь worker өөрөө
    # шийдэж чадаагүй алдаа гэсэн үг.
    DeadLetterAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmDescription: A notification was dead-lettered
        Namespace: AWS/Lambda
        MetricName: Invocations
        Dimensions:
          - Name: FunctionName
            Value:
              Ref: DlqProcessorLambdaFunction
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - Ref: AlarmTopic

    WorkerErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmDescription: The worker Lambda crashed or timed out
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value:
              Ref: WorkerLambdaFunction
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - Ref: AlarmTopic

    ApiErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmDescription: createNotification is failing
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value:
              Ref: CreateNotificationLambdaFunction
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - Ref: AlarmTopic

    PreSignUpInvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        Action: lambda:InvokeFunction
        FunctionName:
          Fn::GetAtt: [PreSignUpLambdaFunction, Arn]
        Principal: cognito-idp.amazonaws.com

    UserPool:
      Type: AWS::Cognito::UserPool
      DependsOn: PreSignUpInvokePermission
      Properties:
        UserPoolName: ${self:service}-${self:provider.stage}-users
        UsernameAttributes:
          - email
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireLowercase: true
            RequireUppercase: false
            RequireNumbers: true
            RequireSymbols: false
        LambdaConfig:
          PreSignUp:
            Fn::GetAtt: [PreSignUpLambdaFunction, Arn]

    UserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: ${self:service}-${self:provider.stage}-web
        UserPoolId:
          Ref: UserPool
        GenerateSecret: false

        PreventUserExistenceErrors: LEGACY
        ExplicitAuthFlows:
          - ALLOW_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH

  Outputs:
    UserPoolId:
      Value:
        Ref: UserPool
    UserPoolClientId:
      Value:
        Ref: UserPoolClient
